### kubectl run nginx --image=nginx

# Task-2
### kubectl get pod nginx -o yaml > nginx.yaml
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx
  name: nginx-new
  namespace: default
spec:
  containers:
  - image: nginx
    imagePullPolicy: Always
    name: nginx-new

